ReleaseNotes: |-
  Build 189. Bug-fix release built on a product-wide review of how the
  application handles accented and non-Latin text: files and folders with such
  names now work in Compare Directories, on the command line, with the
  external archivers, in the cloud entries of the drive bar, in shortcuts and
  Explorer drag-and-drop, in volume information and in the remaining dialogs
  and lists - and the crash that a long or non-Latin name on the command line
  could cause is gone. Files whose name contains a broken (unpaired-surrogate)
  character can be deleted, copied, moved, renamed and viewed at last, byte
  counts no longer show a stray Â in accented languages, and Markdown files
  open instantly after the first view of a session. Full Debug and Release
  builds and the unit test suite (1301/0) pass.
ReleaseNotesUrl: https://github.com/tandemcommander/tandemcommander/releases/tag/v0.1.5
