# Open Salamander plugin build policy.
#
# Read by build.cmd on every run: only plugins set to "on" are compiled
# and shipped; plugins set to "off" are skipped and their files are
# removed from the build output. Every plugin directory under
# src\plugins\ (except "shared") must have exactly one line here --
# the build stops with an error otherwise.
#
# Syntax: <plugin-directory-name>=on|off   (names are case-insensitive,
# "#" starts a comment, blank lines are ignored)
#
# See specs/007-plugin-build-policy/ for the full specification.

7zip=on
automation=off
checksum=on
checkver=off
codeview=on
dbviewer=on
demomenu=off
demoplug=off
demoview=off
diskmap=on
filecomp=on
folders=on
ftp=on
mdview=on
mmviewer=off
nethood=off
peviewer=on
pictview=on
portables=on
regedt=on
renamer=on
sftp=on
tar=on
uncab=on
unchm=off
undelete=on
uniso=on
unmime=off
unole=off
unrar=off
zip=on
